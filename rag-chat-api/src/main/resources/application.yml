server:
  port: 8082
spring:
  application:
    name: rag-chat-api
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  kafka:
    bootstrap-servers: localhost:9092 # 你的 Kafka 地址
    producer:
      #key 试用普通的字符串序列化
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      #value 试用String提供的JSON序列化器，传输java对象
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  ai:
    openai:
      api-key: sk-012f3d8e8af54bb7972a21a978096906
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-plus # 默认聊天用文本模型
          temperature: 1
      embedding:
        options:
          model: text-embedding-v3 # 阿里云向量模型 检索和写入必须使用一样的向量模型
    vectorstore:
      redis:
        uri: redis://localhost:6379
        index: company-knowledge-index
        prefix: "doc:"
        initialize-schema: false

